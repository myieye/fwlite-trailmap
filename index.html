<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Road to FW Lite 1.0</title>
    <meta name="description" content="Where FieldWorks Lite is heading, what the team is working on, and what's already done." />

    <script>
      // Before first paint, so a saved theme doesn't flash the other one.
      try {
        const t = localStorage.getItem('theme')
        if (t) document.documentElement.dataset.theme = t
      } catch {}
    </script>

    <div id="app"></div>

  </body>
