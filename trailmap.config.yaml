# Trailmap config: the one file a human edits to shape the roadmap.
# `npm run sync` reads this, pulls GitHub + forum data, and writes public/data/snapshot.json.
# Issue refs are "<repo key>#<number>", e.g. lexbox#2700.

site:
  title: The Road to FieldWorks Lite 1.0
  team: the FW Lite team
  # Shown in the header so stakeholders know what "1.0" means.
  summitBlurb: >-
    Version 1.0 is the point where we'd tell any FieldWorks team "yes, use FW Lite
    for your everyday dictionary work". No data surprises, works on every device you own.

repos:
  - key: lexbox
    owner: sillsdev
    name: languageforge-lexbox
    label: FW Lite & Lexbox
  - key: harmony
    owner: sillsdev
    name: harmony
    label: Harmony (sync engine)

people:
  # Work done by a person's AI agent account counts as theirs.
  aliases:
    hahn-kev-bot: hahn-kev
  ignore:
    - dependabot[bot]
    - github-actions[bot]
    - crowdin-bot

# The summit: every issue in this milestone belongs to the v1 journey.
summit:
  repo: lexbox
  milestone: FW Lite v1
  start: Beta · Feb 2025

# Camps are stops on the trail, in walking order. Each lists the issues that make it up.
# Milestone issues not listed in any camp show up in a "Still to sort" camp, so nothing gets lost.
camps:
  - id: editing-feels-right
    name: Editing feels right
    icon: ✏️
    blurb: Entries, senses and complex forms look and behave the way you expect from FLEx, and the list and search keep up with you.
    issues: [lexbox#1369, lexbox#1681, lexbox#2742, lexbox#2745, lexbox#1633, lexbox#2659, lexbox#1396, lexbox#2231, lexbox#2480, lexbox#2678,
      lexbox#1017, lexbox#1334, lexbox#1372, lexbox#1540, lexbox#1571, lexbox#1584, lexbox#1587, lexbox#1636, lexbox#1642, lexbox#1675,
      lexbox#1677, lexbox#1682, lexbox#1684, lexbox#1685, lexbox#1686, lexbox#1688, lexbox#1689, lexbox#1699, lexbox#1718, lexbox#1869,
      lexbox#1963, lexbox#1491, lexbox#1705, lexbox#1318, lexbox#1319, lexbox#1767, lexbox#1413, lexbox#1628]
  - id: working-together
    name: Working together
    icon: 💬
    blurb: Teammates can comment, review each other's work and sign in without friction.
    issues: [lexbox#2746, lexbox#2747, lexbox#1889, lexbox#1941, lexbox#1765, lexbox#1707, lexbox#1806, lexbox#1763]
  - id: pictures-and-audio
    name: Pictures and audio
    icon: 🎙️
    blurb: Recordings and pictures you add stay attached to the right entry, on every device.
    issues: [lexbox#2693, lexbox#2700, lexbox#1764, lexbox#1834, lexbox#1835, lexbox#1878]
  - id: your-data-is-safe
    name: Your data is safe
    icon: 🛡️
    blurb: Nothing you type gets lost, and when the app says "synced" your work really did reach the server.
    issues: [lexbox#1391, lexbox#2169, lexbox#2498, lexbox#2431, lexbox#2292, lexbox#2662, lexbox#2229,
      lexbox#1307, lexbox#1615, lexbox#1621, lexbox#1687, lexbox#1700, lexbox#1735, lexbox#1799, lexbox#1717, lexbox#2515,
      lexbox#1475, lexbox#1414, lexbox#1411, lexbox#1875, lexbox#1801, lexbox#1513]
  - id: on-every-device
    name: On every device
    icon: 📦
    blurb: Easy installs and updates on Windows, Mac, Android, iPhone and inside Paratext, with clear help pages.
    issues: [lexbox#1299, lexbox#1743, lexbox#2647, lexbox#2211, lexbox#1480,
      lexbox#1241, lexbox#1325, lexbox#1603, lexbox#2148, lexbox#2316, lexbox#1341, lexbox#1431, lexbox#1469, lexbox#1470,
      lexbox#1607, lexbox#1678, lexbox#1511, lexbox#1532, lexbox#2743]

# The Harmony river: goals for the sync engine everything floats on.
river:
  - id: never-lose-an-edit
    name: Sync never quietly loses an edit
    icon: 🛟
    blurb: Every edit from every device ends up everywhere, even when clocks are wrong or a sync gets cut off.
    issues: [harmony#79, harmony#89, harmony#90, harmony#104, harmony#7, harmony#119, harmony#121, harmony#107, harmony#126, harmony#108, harmony#105, harmony#80, harmony#70]
  - id: old-and-new-agree
    name: Old and new app versions get along
    icon: 🤝
    blurb: Someone on last month's version and someone on today's can still share one project.
    issues: [harmony#135, harmony#145, harmony#141, harmony#80, harmony#91]
  - id: media-on-the-river
    name: Pictures and audio travel too
    icon: 🖼️
    blurb: Media files sync like any other data and stay findable after the app moves or reinstalls.
    issues: [harmony#140, harmony#47, harmony#75, harmony#136]
  - id: faster-and-smaller
    name: Faster and lighter
    icon: ⚡
    blurb: Syncs finish sooner and project files stay small enough for phones.
    issues: [harmony#143, harmony#77, harmony#86, harmony#118, harmony#64, harmony#72, harmony#66]

# Beasts: long, hard bugs we hunt on purpose. The page lights a step ladder from GitHub
# (reported, fix in progress, fix merged, closed); set `causeFound` once we know why it happens.
beasts:
  - issue: lexbox#1391
    name: The Uninstall Bear
    creature: 🐻
    lore: Eats a whole project when someone uninstalls the app.
    camp: your-data-is-safe
  - issue: lexbox#2169
    name: The Last-Second Raccoon
    creature: 🦝
    lore: Snatches your final edit if you close the app right after typing.
    camp: your-data-is-safe
    causeFound: true
  - issue: lexbox#2498
    name: The Fake-Synced Chameleon
    creature: 🦎
    lore: Marks edits as synced before they leave the device, so gaps go unnoticed.
    camp: your-data-is-safe
    causeFound: true
  - issue: lexbox#2431
    name: The Copycat
    creature: 🐈‍⬛
    lore: When a project folder is copied, two devices start pretending to be one.
    camp: your-data-is-safe
    causeFound: true
  - issue: lexbox#2292
    name: The Stuck-Download Spider
    creature: 🕷️
    lore: A download that fails halfway leaves a project that looks fine but is empty.
    camp: your-data-is-safe
    causeFound: true
  - issue: lexbox#2693
    name: The Reinstall Crow
    creature: 🐦‍⬛
    lore: Hides your audio and pictures after an iPhone or iPad app update.
    camp: pictures-and-audio
    causeFound: true
    # Harmony now stores media paths relative to the app folder.
    progress: [harmony#136]
  - issue: lexbox#2700
    name: The Look-alike Sheep
    creature: 🐑
    lore: Two different media files with the same name get treated as one.
    camp: pictures-and-audio

