# Weekly: Claude writes plain-language titles for new GitHub items and a PR brings them to a human.
# The model reads text anyone can write on GitHub, so it gets no tools, no repo and no GitHub token: text in, JSON out.
# Each job holds only what it needs: `todo` runs npm packages but has no secret, `draft` has the Claude token but runs
# no npm packages, `propose` can push but never sees the token and re-checks the model's output itself.
name: Refresh plain words

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: plain-words

jobs:
  todo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      count: ${{ steps.todo.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: todo
        run: |
          node scripts/plain-todo.mjs > "$RUNNER_TEMP/todo.json"
          echo "count=$(node -p 'Object.keys(require(process.argv[1])).length' "$RUNNER_TEMP/todo.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo
          path: ${{ runner.temp }}/todo.json
          retention-days: 3

  draft:
    needs: todo
    if: needs.todo.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: claude
    permissions:
      contents: read
    env:
      CLAUDE_VERSION: 2.1.304
      CLAUDE_SHA512: c99ff3664df2eded336e432cef8d32f59f9bb38d0c996029c0cf6a1d0f00762b34d52c9c425c9a6671d8841ffe50e78525c2fe8736e2206088cae4cac8bd94ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: todo
          path: ${{ runner.temp }}
      # The bare binary from the registry, checked against a pinned hash, so no npm install scripts run here.
      - name: Install Claude Code
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o claude.tgz "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-$CLAUDE_VERSION.tgz"
          echo "$CLAUDE_SHA512  claude.tgz" | sha512sum -c --quiet
          tar -xzf claude.tgz package/claude
          mkdir empty home
      - run: node scripts/plain-words/input.mjs "$RUNNER_TEMP/todo.json" > "$RUNNER_TEMP/input.txt"
      # Run from an empty folder with an empty HOME so no CLAUDE.md, settings, skills or MCP config can load.
      - name: Ask Claude
        working-directory: ${{ runner.temp }}/empty
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HOME: ${{ runner.temp }}/home
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          "$RUNNER_TEMP/package/claude" -p \
            --model sonnet \
            --tools "" \
            --strict-mcp-config \
            --setting-sources "" \
            --disable-slash-commands \
            --no-session-persistence \
            --output-format json \
            --system-prompt "$(cat "$GITHUB_WORKSPACE/scripts/plain-words/prompt.md")" \
            --json-schema "$(cat "$GITHUB_WORKSPACE/scripts/plain-words/schema.json")" \
            < "$RUNNER_TEMP/input.txt" > "$RUNNER_TEMP/claude.json"
      - name: Check the draft
        run: |
          node -e '
            const out = require(process.argv[1])
            if (out.is_error || !out.structured_output) { console.error("Claude failed:", out.subtype); process.exit(1) }
            require("node:fs").writeFileSync(process.argv[2], JSON.stringify(out.structured_output))
          ' "$RUNNER_TEMP/claude.json" "$RUNNER_TEMP/draft.json"
          node scripts/plain-words/apply.mjs "$RUNNER_TEMP/todo.json" "$RUNNER_TEMP/draft.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft
          path: ${{ runner.temp }}/draft.json
          retention-days: 3

  propose:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}
          merge-multiple: true
      - run: node scripts/plain-words/apply.mjs "$RUNNER_TEMP/todo.json" "$RUNNER_TEMP/draft.json"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$(git status --porcelain)" ] && exit 0
          if [ "$(git status --porcelain)" != " M content/plain-words.json" ]; then
            git status --porcelain
            echo "Expected only content/plain-words.json to change" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c plain-words-refresh
          git commit -qam "Refresh plain words"
          git push -qf origin plain-words-refresh
          if [ -z "$(gh pr list --head plain-words-refresh --state open --json number -q '.[].number')" ]; then
            gh pr create --head plain-words-refresh --title "Refresh plain words" \
              --body "Titles written by Claude from GitHub titles only. Check each one before merging: the source text is public and anyone can write it."
          fi
